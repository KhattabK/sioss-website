<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1188" role="img" aria-labelledby="sjssCoverTitle" font-family="Archivo, 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
  <title id="sjssCoverTitle">Cover of The SIOSS Journal of Sport Science, Volume 1, Issue 1, January 2017</title>
  <defs>
    <linearGradient id="sjssBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e15"/>
      <stop offset="1" stop-color="#0e2038"/>
    </linearGradient>
    <linearGradient id="sjssPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc3f7" stop-opacity="0"/>
      <stop offset=".18" stop-color="#4cc3f7"/>
      <stop offset=".7" stop-color="#4cc3f7"/>
      <stop offset="1" stop-color="#4cc3f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sjssClip"><rect width="840" height="1188"/></clipPath>
  </defs>

  <rect width="840" height="1188" fill="url(#sjssBg)"/>

  <!-- running-track lanes -->
  <g clip-path="url(#sjssClip)" fill="none" stroke="#1a6fc4" stroke-width="2">
    <circle cx="930" cy="700" r="250" opacity=".9"/>
    <circle cx="930" cy="700" r="300" opacity=".75"/>
    <circle cx="930" cy="700" r="350" opacity=".6"/>
    <circle cx="930" cy="700" r="400" stroke="#f5b83d" stroke-width="4" opacity="1"/>
    <circle cx="930" cy="700" r="450" opacity=".45"/>
    <circle cx="930" cy="700" r="500" opacity=".32"/>
    <circle cx="930" cy="700" r="550" opacity=".22"/>
    <circle cx="930" cy="700" r="600" opacity=".14"/>
  </g>

  <!-- heart-rate trace -->
  <path d="M0 700 H236 l18 -34 l20 62 l26 -150 l30 196 l24 -104 l16 30 H470 l16 -22 l14 22 H840" fill="none" stroke="url(#sjssPulse)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- masthead -->
  <rect width="840" height="8" fill="#1a6fc4"/>
  <text x="64" y="92" font-size="15" font-weight="600" letter-spacing="2.4" fill="#4cc3f7">PEER-REVIEWED · OPEN ACCESS</text>
  <text x="776" y="92" font-size="15" font-weight="600" letter-spacing="1.6" fill="#9aa5b8" text-anchor="end">ISSN 2519-6634</text>

  <text x="58" y="290" font-size="196" font-weight="800" letter-spacing="-7" fill="#ffffff">SJSS</text>
  <text x="64" y="372" font-size="50" font-weight="700" letter-spacing="-1" fill="#ffffff">The SIOSS Journal</text>
  <text x="64" y="432" font-size="50" font-weight="700" letter-spacing="-1" fill="#ffffff">of Sport Science</text>
  <rect x="64" y="470" width="72" height="6" fill="#f5b83d"/>

  <!-- issue -->
  <text x="64" y="1012" font-size="32" font-weight="700" letter-spacing="1" fill="#ffffff">VOLUME 1 · ISSUE 1</text>
  <text x="64" y="1052" font-size="24" font-weight="500" fill="#9aa5b8">January 2017</text>
  <rect x="64" y="1088" width="712" height="1" fill="#242d3d"/>
  <text x="64" y="1128" font-size="15" font-weight="500" fill="#9aa5b8">Swedish International Organization of Sport Science</text>
  <text x="776" y="1128" font-size="15" font-weight="600" fill="#4cc3f7" text-anchor="end">sioss.se/journal</text>
</svg>
