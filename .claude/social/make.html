<!doctype html>
<!-- Local tool (not deployed): renders the SJSS cover and social posters to PNG in /marketing.
     Open through .claude/serve.ps1, then call window.makeAll(). -->
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>SJSS social images</title>
<style>body{background:#111;color:#ccc;font-family:system-ui;padding:20px} img{max-width:320px;margin:8px;border:1px solid #333}</style>
</head>
<body>
<p id="status">working…</p>
<div id="out"></div>
<script>
const C = { dark: '#0a0e15', navy: '#0e2038', card: '#111a29', primary: '#1a6fc4', accent: '#4cc3f7', yellow: '#f5b83d', white: '#ffffff', muted: '#9aa5b8', soft: '#c4cddb', border: '#242d3d' };
const AR = "Cairo, 'Segoe UI', Tahoma, sans-serif";
const EN = "Archivo, 'Segoe UI', Arial, sans-serif";
const W = 1080;

// Embed the web fonts as data URIs so an SVG rendered as an image can use them
async function fontCss() {
  const css = await (await fetch('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap')).text();
  const blocks = css.split('/*').slice(1).map(b => '/*' + b).filter(b => /^\/\* (arabic|latin) \*\//.test(b));
  const cache = {};
  let out = '';
  for (const b of blocks) {
    const url = b.match(/url\((https:[^)]+)\)/)[1];
    if (!cache[url]) {
      const buf = await (await fetch(url)).arrayBuffer();
      let bin = ''; new Uint8Array(buf).forEach(x => bin += String.fromCharCode(x));
      cache[url] = 'data:font/woff2;base64,' + btoa(bin);
    }
    out += b.replace(url, cache[url]);
  }
  return out;
}

const rtl = (x, y, size, weight, fill, text, anchor = 'start') =>
  `<text x="${x}" y="${y}" font-family="${AR}" font-size="${size}" font-weight="${weight}" fill="${fill}" direction="rtl" unicode-bidi="plaintext" text-anchor="${anchor}">${text}</text>`;
const ltr = (x, y, size, weight, fill, text, anchor = 'start', extra = '') =>
  `<text x="${x}" y="${y}" font-family="${EN}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" ${extra}>${text}</text>`;

function bullets(items, y, step, size) {
  return items.map((t, i) =>
    `<rect x="984" y="${y + i * step - size * 0.42}" width="16" height="16" fill="${C.yellow}"/>` + rtl(960, y + i * step, size, 600, C.white, t)
  ).join('');
}

// Shared frame: background, track lanes, pulse, masthead and the contact footer
function frame(H, L, body, box) {
  const lanes = [200, 250, 300, 350, 400, 450, 500].map((r, i) =>
    `<circle cx="-70" cy="${L.lanes}" r="${r}" ${i === 3 ? `stroke="${C.yellow}" stroke-width="4"` : `opacity="${0.7 - i * 0.08}"`}/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${C.dark}"/><stop offset="1" stop-color="${C.navy}"/></linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${C.accent}" stop-opacity="0"/><stop offset=".3" stop-color="${C.accent}"/><stop offset=".75" stop-color="${C.accent}"/><stop offset="1" stop-color="${C.accent}" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#bg)"/>
  <clipPath id="art"><rect x="0" y="${L.mast + 73}" width="${W}" height="${L.foot - L.mast - 73}"/></clipPath>
  <g fill="none" stroke="${C.primary}" stroke-width="2" clip-path="url(#art)">${lanes}</g>
  <path d="M0 ${L.pulse} H150 l14 -28 l16 50 l22 -124 l25 162 l20 -86 l13 26 H320" fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <rect width="${W}" height="10" fill="${C.primary}"/>

  ${ltr(80, L.mast, 68, 800, C.white, 'SJSS', 'start', 'letter-spacing="-2"')}
  ${ltr(80, L.mast + 40, 19, 600, C.muted, 'ISSN 2519-6634', 'start', 'letter-spacing="1.5"')}
  ${rtl(1000, L.mast - 14, 32, 700, C.white, 'مجلة SIOSS لعلوم الرياضة')}
  ${rtl(1000, L.mast + 34, 23, 600, C.accent, 'مجلة علمية محكّمة · وصول مفتوح')}
  <rect x="80" y="${L.mast + 72}" width="920" height="1" fill="${C.border}"/>

  ${body}

  <rect x="0" y="${L.foot}" width="${W}" height="226" fill="${C.dark}" opacity=".9"/>
  <rect x="0" y="${L.foot}" width="${W}" height="1" fill="${C.border}"/>
  <rect x="80" y="${L.foot + 38}" width="290" height="150" rx="6" fill="${C.yellow}"/>
  ${box(L.foot)}
  ${rtl(1000, L.foot + 72, 27, 600, C.muted, 'أرسل بحثك إلى')}
  ${ltr(1000, L.foot + 132, 54, 700, C.white, 'hello@sioss.se', 'end', 'letter-spacing="-1"')}
  ${ltr(1000, L.foot + 180, 27, 600, C.accent, 'sioss.se/journal', 'end')}
</svg>`;
}

const feeBox = f =>
  `<text x="225" y="${f + 88}" font-family="${AR}" font-size="27" font-weight="700" fill="${C.dark}" text-anchor="middle">رسوم النشر</text>` +
  ltr(225, f + 160, 70, 800, C.dark, '$100', 'middle', 'letter-spacing="-2"');
const ctaBox = f =>
  `<text x="225" y="${f + 104}" font-family="${AR}" font-size="44" font-weight="800" fill="${C.dark}" text-anchor="middle">أرسل بحثك</text>` +
  `<text x="225" y="${f + 158}" font-family="${AR}" font-size="38" font-weight="800" fill="${C.dark}" text-anchor="middle">الآن</text>`;

// Poster 1 — the advert: why publish with SJSS
function advert(H, L) {
  const card = (x, y, value, label, opts = {}) => {
    const right = x + 450 - 30;
    const v = opts.latin
      ? ltr(right, y + 70, opts.size || 40, 800, opts.fill || C.white, value, 'end', 'letter-spacing="-1"')
      : rtl(right, y + 70, 42, 800, opts.fill || C.white, value);
    return `<rect x="${x}" y="${y}" width="450" height="150" rx="8" fill="${C.card}" stroke="${C.border}"/>
      <rect x="${x + 450 - 6}" y="${y + 24}" width="6" height="102" fill="${opts.bar || C.primary}"/>${v}${rtl(right, y + 116, 24, 600, C.muted, label)}`;
  };
  const body = `
  <rect x="770" y="${L.pill}" width="230" height="58" rx="29" fill="${C.yellow}"/>
  <text x="885" y="${L.pill + 40}" font-family="${AR}" font-size="29" font-weight="800" fill="${C.dark}" text-anchor="middle">دعوة للنشر</text>
  ${rtl(1000, L.head, 150, 800, C.white, 'انشر بحثك')}
  ${rtl(1000, L.head + 104, 68, 800, C.accent, 'في مجلة علمية محكّمة')}
  ${rtl(1000, L.head + 172, 34, 600, C.soft, 'نستقبل بحوثكم في جميع مجالات علوم الرياضة')}

  ${card(550, L.cards, 'تحكيم علمي', 'كل بحث يُراجَع من محكّمين مختصين')}
  ${card(80,  L.cards, 'ISSN 2519-6634', 'رقم دولي معياري للمجلة', { latin: true, size: 38 })}
  ${card(550, L.cards + 170, 'وصول مفتوح', 'بحثك متاح للقراء حول العالم مجاناً')}
  ${card(80,  L.cards + 170, '$100', 'رسوم النشر للبحث الواحد', { latin: true, size: 58, fill: C.yellow, bar: C.yellow })}

  ${rtl(1000, L.cards + 386, 27, 600, C.soft, 'تصدر عن المنظمة السويدية الدولية للعلوم الرياضية (SIOSS) — السويد')}`;
  return frame(H, L, body, ctaBox);
}

// Poster 2 — the supplement: conditions and what to send
function instructions(H, L) {
  const rules = ['بحث أصيل لم يسبق نشره أو تقديمه لمجلة أخرى', 'مكتوب باللغة الإنجليزية ووفق قالب المجلة', 'لا يتجاوز 10 صفحات', 'جميع البحوث تخضع للتحكيم العلمي'];
  const send  = ['ملف البحث كاملاً بصيغة PDF', 'الملخص (Abstract) والكلمات المفتاحية', 'أسماء الباحثين وجهات عملهم والبريد الإلكتروني', 'إقرار بأن البحث لم يُنشر في جهة أخرى'];
  const body = `
  ${rtl(1000, L.head, 88, 800, C.white, 'شروط وتعليمات النشر')}
  ${rtl(1000, L.head + 62, 32, 600, C.soft, 'كل ما تحتاجه لإرسال بحثك إلى المجلة')}
  <rect x="910" y="${L.head + 92}" width="90" height="8" fill="${C.yellow}"/>

  ${rtl(1000, L.s1, 40, 800, C.accent, 'شروط النشر')}
  ${bullets(rules, L.s1 + L.gap, L.step, L.size)}

  ${rtl(1000, L.s2, 40, 800, C.accent, 'ماذا ترسل؟')}
  ${bullets(send, L.s2 + L.gap, L.step, L.size)}`;
  return frame(H, L, body, feeBox);
}

const AD_FEED    = { lanes: 430,  pulse: 335, mast: 118, pill: 232, head: 440, cards: 660, foot: 1124 };
const AD_STORY   = { lanes: 640,  pulse: 500, mast: 300, pill: 440, head: 660, cards: 900, foot: 1500 };
const INS_FEED   = { lanes: 760,  pulse: -500, mast: 118, head: 318, s1: 500, s2: 818,  gap: 64, step: 56, size: 30, foot: 1124 };
const INS_STORY  = { lanes: 1180, pulse: -500, mast: 300, head: 540, s1: 770, s2: 1150, gap: 76, step: 70, size: 34, foot: 1500 };

async function render(svg, css, w, h, name) {
  const withFonts = svg.replace(/(<svg[^>]*>)/, `$1<style>${css}</style>`);
  const url = URL.createObjectURL(new Blob([withFonts], { type: 'image/svg+xml' }));
  const img = new Image(); img.src = url; await img.decode();
  const canvas = Object.assign(document.createElement('canvas'), { width: w, height: h });
  const ctx = canvas.getContext('2d');
  for (let i = 0; i < 2; i++) { ctx.drawImage(img, 0, 0, w, h); await new Promise(r => setTimeout(r, 400)); }
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  await fetch('/__save/' + name, { method: 'POST', body: blob });
  const preview = new Image(); preview.src = URL.createObjectURL(blob); document.getElementById('out').append(preview);
  return name + ' ' + Math.round(blob.size / 1024) + ' KB';
}

// ── TikTok: profile picture and video covers ──
function avatar() {
  const lanes = [150, 200, 250, 300, 350, 400].map((r, i) =>
    `<circle cx="60" cy="700" r="${r}" ${i === 2 ? `stroke="${C.yellow}" stroke-width="5"` : `opacity="${0.75 - i * 0.1}"`}/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${C.dark}"/><stop offset="1" stop-color="#123055"/></linearGradient></defs>
  <rect width="720" height="720" fill="url(#bg)"/>
  <g fill="none" stroke="${C.primary}" stroke-width="3">${lanes}</g>
  ${ltr(360, 392, 168, 800, C.white, 'SIOSS', 'middle', 'letter-spacing="-5"')}
  <rect x="300" y="430" width="120" height="10" fill="${C.yellow}"/>
</svg>`;
}

const COVERS = [

  ['خريجونا',      ['ماذا قال', 'خريجو SIOSS؟']],
  ['من نحن',       ['SIOSS', 'في 30 ثانية']],
  ['علوم الرياضة', ['3 علامات أن', 'لاعبك يحتاج راحة']],
  ['من دوراتنا',   ['دورة القوة والحركة', 'في البحرين']],
  ['المجلة',       ['انشر بحثك', 'في مجلة علمية محكّمة']],
  ['علوم الرياضة', ['خطأ شائع', 'في الإحماء']],
  ['اعتماداتنا',   ['من يعترف', 'بشهادات SIOSS؟']],
  ['التغذية',      ['ماذا يأكل اللاعب', 'قبل المباراة؟']],
  ['خريجونا',      ['تجربتي مع', 'دورات SIOSS']],
  ['علوم الرياضة', ['كيف تقرأ رقم', 'الـ HRV الصباحي؟']],
  ['المجلة',       ['شروط النشر', 'خطوة بخطوة']],
];

function cover(cat, lines) {
  const H = 1920, pillW = 60 + cat.length * 24;
  const lanes = [260, 330, 400, 470, 540, 610, 680].map((r, i) =>
    `<circle cx="-90" cy="1500" r="${r}" ${i === 3 ? `stroke="${C.yellow}" stroke-width="5"` : `opacity="${0.7 - i * 0.08}"`}/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${C.dark}"/><stop offset="1" stop-color="#123055"/></linearGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#bg)"/>
  <g fill="none" stroke="${C.primary}" stroke-width="3">${lanes}</g>
  <rect x="${1000 - pillW}" y="640" width="${pillW}" height="70" rx="35" fill="${C.yellow}"/>
  <text x="${1000 - pillW / 2}" y="689" font-family="${AR}" font-size="36" font-weight="800" fill="${C.dark}" text-anchor="middle">${cat}</text>
  ${rtl(1000, 880, Math.min(118, Math.floor(900 / (lines[0].length * 0.5))), 800, C.white, lines[0])}
  ${rtl(1000, 1030, Math.min(96, Math.floor(900 / (lines[1].length * 0.5))), 800, C.accent, lines[1])}
  <rect x="880" y="1090" width="120" height="10" fill="${C.yellow}"/>
  ${ltr(1000, 1250, 64, 800, C.white, 'SIOSS', 'end', 'letter-spacing="-2"')}
</svg>`;
}

window.makeTikTok = async function () {
  const css = await fontCss();
  const done = [await render(avatar(), css, 720, 720, 'tiktok-profile-picture.png')];
  for (let i = 0; i < COVERS.length; i++) {
    done.push(await render(cover(...COVERS[i]), css, W, 1920, `tiktok-cover-${String(i + 1).padStart(2, '0')}.png`));
  }
  document.getElementById('status').textContent = 'saved: ' + done.join(' | ');
  return done;
};

window.makeAll = async function () {
  const css = await fontCss();
  const cover = (await (await fetch('/journal/cover.svg')).text()).replace('<svg ', '<svg width="840" height="1188" ');
  const done = [
    await render(cover, css, 1680, 2376, 'sjss-cover.png'),
    await render(advert(1350, AD_FEED), css, W, 1350, 'sjss-1-advert-instagram.png'),
    await render(instructions(1350, INS_FEED), css, W, 1350, 'sjss-2-instructions-instagram.png'),
    await render(advert(1920, AD_STORY), css, W, 1920, 'sjss-1-advert-story.png'),
    await render(instructions(1920, INS_STORY), css, W, 1920, 'sjss-2-instructions-story.png'),
  ];
  document.getElementById('status').textContent = 'saved: ' + done.join(' | ');
  return done;
};
</script>
